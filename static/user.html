<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SystemAssist — User Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak]{display:none!important}
    .scrollbar-thin::-webkit-scrollbar{width:5px}
    .scrollbar-thin::-webkit-scrollbar-track{background:transparent}
    .scrollbar-thin::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
    .scrollbar-thin::-webkit-scrollbar-thumb:hover{background:#475569}
    #user-chat-messages{scroll-behavior:smooth}
    .cat-ERROR{background:#ef444418;color:#f87171;border-color:#ef444440}
    .cat-AUTH{background:#eab30818;color:#fbbf24;border-color:#eab30840}
    .cat-CRUD{background:#3b82f618;color:#60a5fa;border-color:#3b82f640}
    .cat-QUERY{background:#22c55e18;color:#4ade80;border-color:#22c55e40}
    .cat-API{background:#a855f718;color:#c084fc;border-color:#a855f740}
    .cat-SYSTEM{background:#64748b18;color:#94a3b8;border-color:#64748b40}
    .nav-pill{transition:all .15s ease}
    .nav-pill:hover{background:rgba(51,65,85,.4)}
    .nav-pill.active{background:rgba(59,130,246,.12);color:#60a5fa}
    .fade-in{animation:fadeIn .3s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .bar-anim{transition:height .6s cubic-bezier(.4,0,.2,1)}
    .stat-card{background:linear-gradient(135deg,rgba(30,41,59,.7),rgba(15,23,42,.85));transition:transform .2s,box-shadow .2s}
    .stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden" x-data="userApp()" x-init="init()" x-cloak>

  <!-- ════════ LOGIN SCREEN ════════ -->
  <template x-if="!isLoggedIn">
    <div class="flex-1 flex items-center justify-center p-6">
      <div class="w-full max-w-md space-y-6 fade-in">
        <!-- Brand -->
        <div class="text-center space-y-3">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-xl font-bold mx-auto shadow-xl shadow-blue-500/20">SA</div>
          <div>
            <h1 class="text-2xl font-bold">SystemAssist</h1>
            <p class="text-sm text-slate-500 mt-1">User Activity Portal</p>
          </div>
        </div>

        <!-- Login form -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
          <div>
            <label class="text-xs text-slate-400 mb-1.5 block font-medium">API URL</label>
            <input x-model="apiUrl" placeholder="http://localhost:8000"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition-colors"/>
          </div>
          <div>
            <label class="text-xs text-slate-400 mb-1.5 block font-medium">Session Token</label>
            <input x-model="sessionToken" type="password" placeholder="Paste your session token here"
              @keydown.enter="login()"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition-colors"/>
            <p class="text-[10px] text-slate-600 mt-1.5">Your session token is provided by the application you signed into.</p>
          </div>

          <template x-if="loginError"><p class="text-xs text-red-400" x-text="loginError"></p></template>

          <button @click="login()" :disabled="loginLoading || !sessionToken.trim()"
            class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:from-slate-700 disabled:to-slate-700 disabled:text-slate-500 text-white py-2.5 rounded-xl text-sm font-medium transition-all shadow-lg shadow-blue-500/10 disabled:shadow-none flex items-center justify-center gap-2">
            <svg x-show="loginLoading" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            <span x-text="loginLoading ? 'Verifying...' : 'Sign In'"></span>
          </button>
        </div>

        <p class="text-center text-[10px] text-slate-700">Don't have a token? Contact your system administrator.</p>
      </div>
    </div>
  </template>

  <!-- ════════ AUTHENTICATED UI ════════ -->
  <template x-if="isLoggedIn">
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- Header -->
      <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-6 py-3 flex items-center gap-4 shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-xs font-bold shadow-lg shadow-blue-500/10">SA</div>
          <span class="font-semibold text-sm">SystemAssist</span>
        </div>

        <!-- Tab nav -->
        <nav class="flex gap-1 ml-6">
          <template x-for="tab in tabs" :key="tab.id">
            <button @click="activeTab=tab.id; if(tab.id==='insights') loadInsights();"
              :class="activeTab===tab.id ? 'active' : 'text-slate-400'"
              class="nav-pill flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" :d="tab.icon"/></svg>
              <span x-text="tab.label"></span>
            </button>
          </template>
        </nav>

        <div class="flex-1"></div>

        <!-- User info -->
        <div class="flex items-center gap-3">
          <div class="text-right">
            <div class="text-xs text-slate-300 font-medium" x-text="userInfo?.user_id || 'User'"></div>
            <div class="text-[10px] text-slate-500" x-text="'via ' + (userInfo?.app_name || 'app')"></div>
          </div>
          <div class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-bold text-blue-400"
            x-text="(userInfo?.user_id||'U').slice(0,2).toUpperCase()"></div>
          <button @click="logout()" class="text-xs text-slate-500 hover:text-red-400 transition-colors ml-1" title="Sign out">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
          </button>
        </div>
      </header>

      <!-- Content -->
      <main class="flex-1 overflow-hidden">

        <!-- ──── ACTIVITY TAB ──── -->
        <div x-show="activeTab==='activity'" class="h-full flex flex-col">
          <!-- Filter bar -->
          <div class="bg-slate-900/50 border-b border-slate-800 px-6 py-3 flex flex-wrap gap-3 items-center shrink-0">
            <div class="flex items-center gap-2 text-xs text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"/></svg>
              Filters:
            </div>
            <input x-model="logFilter.module" placeholder="Module" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs w-36 focus:outline-none focus:border-blue-500"/>
            <select x-model="logFilter.category" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs w-36 focus:outline-none focus:border-blue-500">
              <option value="">All Categories</option>
              <option>ERROR</option><option>AUTH</option><option>CRUD</option><option>QUERY</option><option>API</option><option>SYSTEM</option>
            </select>
            <select x-model="logFilter.limit" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs w-28 focus:outline-none focus:border-blue-500">
              <option value="20">20 rows</option><option value="50">50 rows</option><option value="100">100 rows</option>
            </select>
            <button @click="loadActivity()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-xs font-medium transition-colors flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
              Refresh
            </button>
            <template x-if="logError"><span class="text-xs text-red-400" x-text="logError"></span></template>
            <template x-if="logs.length>0"><span class="text-xs text-slate-500 ml-auto" x-text="logs.length+' events'"></span></template>
          </div>

          <!-- Log cards -->
          <div class="flex-1 overflow-y-auto scrollbar-thin p-4 space-y-2">
            <template x-if="logLoading">
              <div class="flex items-center justify-center h-32">
                <div class="text-slate-500 text-sm flex items-center gap-2">
                  <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                  Loading...
                </div>
              </div>
            </template>

            <template x-if="logs.length===0 && !logLoading">
              <div class="flex flex-col items-center justify-center h-64 text-slate-600 gap-3">
                <svg class="w-12 h-12 text-slate-700" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                <p class="text-sm">No activity found yet.</p>
                <p class="text-xs text-slate-700">Your actions will appear here as they are logged.</p>
              </div>
            </template>

            <template x-for="(log,i) in logs" :key="i">
              <div @click="expandedLog = expandedLog===i ? null : i"
                class="bg-slate-900/60 border border-slate-800/60 rounded-xl p-4 cursor-pointer hover:border-slate-700 transition-all fade-in">
                <div class="flex items-start gap-3">
                  <!-- Category dot -->
                  <div class="w-2 h-2 rounded-full mt-1.5 shrink-0" :style="'background:' + getCatColor(log.category)"></div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="text-sm font-medium text-slate-200" x-text="log.action"></span>
                      <span class="px-2 py-0.5 rounded-md border text-[10px] font-medium" :class="'cat-'+log.category" x-text="log.category"></span>
                      <span class="text-xs text-slate-600 ml-auto" x-text="(log.timestamp||'').slice(0,19).replace('T',' ')"></span>
                    </div>
                    <div class="flex items-center gap-2 mt-1">
                      <span class="text-xs text-slate-500" x-text="log.module"></span>
                      <template x-if="log.entity"><span class="text-xs text-slate-600">on <span class="text-slate-400" x-text="log.entity"></span></span></template>
                    </div>
                    <template x-if="log.description"><p class="text-xs text-slate-400 mt-1.5" x-text="log.description"></p></template>
                  </div>
                </div>

                <!-- Expanded -->
                <div x-show="expandedLog===i" class="mt-3 pt-3 border-t border-slate-800/50 fade-in">
                  <div class="grid grid-cols-2 gap-3 text-xs">
                    <div><span class="text-slate-500">Log ID: </span><span class="text-slate-400 font-mono" x-text="log.log_id"></span></div>
                    <div><span class="text-slate-500">Entity: </span><span class="text-slate-300" x-text="log.entity||'—'"></span></div>
                    <div class="col-span-2"><span class="text-slate-500">Metadata: </span><span class="text-green-300 font-mono text-[10px]" x-text="JSON.stringify(log.metadata||{})"></span></div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- ──── CHAT TAB ──── -->
        <div x-show="activeTab==='chat'" class="h-full flex flex-col">
          <div id="user-chat-messages" class="flex-1 overflow-y-auto scrollbar-thin px-6 py-4 space-y-4">
            <template x-if="messages.length===0">
              <div class="flex flex-col items-center justify-center h-full text-slate-600 gap-3">
                <svg class="w-14 h-14 text-slate-700" fill="none" stroke="currentColor" stroke-width="0.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                <p class="text-sm font-medium">Ask AI about your activity</p>
                <p class="text-xs text-slate-700 max-w-sm text-center">Ask questions like "What did I do yesterday?" or "Show me my recent errors"</p>
              </div>
            </template>
            <template x-for="(msg,i) in messages" :key="i">
              <div :class="msg.role==='user' ? 'flex justify-end' : 'flex justify-start'" class="fade-in">
                <div :class="msg.role==='user'
                  ? 'bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 max-w-lg text-sm shadow-lg shadow-blue-500/10'
                  : 'bg-slate-800/70 text-slate-200 rounded-2xl rounded-tl-sm px-4 py-3 max-w-2xl text-sm whitespace-pre-wrap border border-slate-700/40'">
                  <p x-text="msg.content"></p>
                </div>
              </div>
            </template>
            <template x-if="chatLoading">
              <div class="flex justify-start fade-in">
                <div class="bg-slate-800/70 border border-slate-700/40 rounded-2xl rounded-tl-sm px-4 py-3">
                  <div class="flex gap-1.5">
                    <span class="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style="animation-delay:0ms"></span>
                    <span class="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style="animation-delay:150ms"></span>
                    <span class="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style="animation-delay:300ms"></span>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Chat input -->
          <div class="border-t border-slate-800 px-6 py-4 bg-slate-900/40 shrink-0">
            <div class="flex gap-3 items-end max-w-3xl mx-auto">
              <textarea x-model="chatInput" @keydown.enter.exact.prevent="sendChat()"
                placeholder="Ask about your activity... (Enter to send)"
                rows="2" :disabled="chatLoading"
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 resize-none focus:outline-none focus:border-blue-500 scrollbar-thin transition-all disabled:opacity-50"></textarea>
              <button @click="sendChat()" :disabled="chatLoading || !chatInput.trim()"
                class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:from-slate-700 disabled:to-slate-700 disabled:text-slate-500 text-white rounded-xl px-5 py-2.5 text-sm font-medium transition-all h-[42px] flex items-center gap-2 shadow-lg shadow-blue-500/10 disabled:shadow-none">
                <svg x-show="chatLoading" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                <span x-text="chatLoading ? 'Thinking...' : 'Send'"></span>
              </button>
            </div>
            <template x-if="chatError"><p class="mt-2 text-xs text-red-400 max-w-3xl mx-auto" x-text="chatError"></p></template>
          </div>
        </div>

        <!-- ──── INSIGHTS TAB ──── -->
        <div x-show="activeTab==='insights'" class="h-full overflow-y-auto scrollbar-thin p-6 fade-in">
          <template x-if="statsLoading">
            <div class="flex items-center justify-center h-64">
              <div class="text-slate-500 text-sm flex items-center gap-2">
                <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                Loading insights...
              </div>
            </div>
          </template>

          <template x-if="stats && !statsLoading">
            <div class="max-w-4xl mx-auto space-y-6">
              <div>
                <h2 class="text-lg font-semibold">Your Activity Insights</h2>
                <p class="text-xs text-slate-500 mt-0.5" x-text="'Last ' + stats.period_days + ' days'"></p>
              </div>

              <!-- Stat cards -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="stat-card rounded-xl border border-slate-800 p-5">
                  <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Total Events</div>
                  <div class="text-2xl font-bold text-slate-100" x-text="(stats.total_logs||0).toLocaleString()"></div>
                </div>
                <div class="stat-card rounded-xl border border-slate-800 p-5">
                  <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Error Rate</div>
                  <div class="text-2xl font-bold" :class="stats.error_rate>5?'text-red-400':'text-green-400'" x-text="stats.error_rate+'%'"></div>
                </div>
                <div class="stat-card rounded-xl border border-slate-800 p-5">
                  <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">Active Modules</div>
                  <div class="text-2xl font-bold text-purple-400" x-text="Object.keys(stats.modules||{}).length"></div>
                </div>
              </div>

              <!-- Categories + Modules -->
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
                  <h3 class="text-sm font-semibold text-slate-300 mb-4">Categories</h3>
                  <div class="space-y-3">
                    <template x-for="[cat,count] in Object.entries(stats.categories||{})" :key="cat">
                      <div>
                        <div class="flex justify-between text-xs mb-1">
                          <span class="font-medium" :style="'color:'+getCatColor(cat)" x-text="cat"></span>
                          <span class="text-slate-500" x-text="count"></span>
                        </div>
                        <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                          <div class="h-full rounded-full bar-anim" :style="'width:'+Math.max(count/stats.total_logs*100,2)+'%;background:'+getCatColor(cat)"></div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
                  <h3 class="text-sm font-semibold text-slate-300 mb-4">Modules</h3>
                  <div class="space-y-2">
                    <template x-for="[mod,count] in Object.entries(stats.modules||{})" :key="mod">
                      <div class="flex items-center justify-between py-1.5 border-b border-slate-800/50 last:border-0">
                        <span class="text-xs text-slate-300 font-mono" x-text="mod"></span>
                        <span class="text-xs text-slate-500 bg-slate-800 rounded-lg px-2 py-0.5" x-text="count"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Hourly distribution -->
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
                <h3 class="text-sm font-semibold text-slate-300 mb-4">Activity by Hour</h3>
                <div class="flex items-end gap-0.5 h-24">
                  <template x-for="h in 24" :key="h">
                    <div class="flex-1 flex flex-col items-center gap-1 group">
                      <div class="w-full rounded-t bar-anim"
                        :class="(stats.hourly_distribution||{})[h-1] ? 'bg-blue-500/70 hover:bg-blue-400' : 'bg-slate-800'"
                        :style="'height:' + Math.max(((stats.hourly_distribution||{})[h-1]||0) / Math.max(...Object.values(stats.hourly_distribution||{1:1}), 1) * 100, 3) + '%'"
                        :title="(h-1)+':00 — ' + ((stats.hourly_distribution||{})[h-1]||0) + ' events'"></div>
                    </div>
                  </template>
                </div>
                <div class="flex justify-between text-[9px] text-slate-600 mt-1">
                  <span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>23:00</span>
                </div>
              </div>

              <!-- Recent Errors -->
              <template x-if="stats.recent_errors && stats.recent_errors.length > 0">
                <div class="bg-slate-900 border border-red-500/10 rounded-xl p-5">
                  <h3 class="text-sm font-semibold text-red-400 mb-3">Recent Errors</h3>
                  <div class="space-y-2">
                    <template x-for="(err,i) in stats.recent_errors" :key="i">
                      <div class="bg-red-500/5 border border-red-500/10 rounded-lg p-3 text-xs">
                        <div class="flex items-center justify-between">
                          <span class="text-red-300 font-mono" x-text="err.action"></span>
                          <span class="text-slate-600" x-text="(err.timestamp||'').slice(0,19).replace('T',' ')"></span>
                        </div>
                        <p class="text-slate-400 mt-1" x-text="err.description || 'No description'"></p>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="!stats && !statsLoading">
            <div class="flex flex-col items-center justify-center h-64 text-slate-600 gap-3">
